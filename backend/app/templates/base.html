<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETU - {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    {% if current_user.is_authenticated %}
    <nav>
        <span>SETU | Logged in as <strong>{{ current_user.name }}</strong> ({{ current_user.role }})</span>
        <a href="/" style="margin-left:16px">Home</a>
        <button onclick="logout()" style="margin-left:16px">Logout</button>
    </nav>
    {% endif %}
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        async function logout() {
            await fetch('/api/v1/auth/logout', {method: 'POST', credentials: 'include'});
            window.location.href = '/';
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
